  answer: '## Transit levy advances

    The council approved a $41.6 million transit levy spread over ten years on a 7-2 vote late Monday, according to the Ardmore Ledger and Lakeshore Public Radio. The levy needs a second reading on March 24. [S1, S2]


    Council member Ines Varga, who voted no, said the city had not published a cost estimate for households. Mayor Theo Brandt called it "the biggest investment in buses this city has made in a generation." [S1, S2]


