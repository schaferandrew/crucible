    ## Teacher pay bill passes legislature

    The legislature passed a bill raising the minimum teacher salary to $48,500, by 39-28 in the Senate and 81-52 in the House. Governor Lena Ruiz is expected to sign it this week, a spokesperson said. [S7]


    ## Rent stabilization rally crowd estimates differ

    The Ardmore Ledger estimated the crowd at about 300. Lakeshore Public Radio reported that organizers said more than 1,000 attended, while police estimated 400. [S5, S6]


