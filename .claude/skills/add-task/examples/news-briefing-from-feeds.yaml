  answer: 'Here is your briefing for Tuesday, March 10.


    The Port Ardmore City Council voted 7-2 late Monday to approve a $41.6 million transit levy spread over ten years, funding three new bus routes and a rebuild of the Fulton Street station. Council member Ines Varga, who voted no, said the city had not published a household cost estimate, and Mayor Theo Brandt called it "the biggest investment in buses this city has made in a generation." The levy needs a second reading on March 24, and collection would begin July 1 if it passes. Columnist Rob Haddad argues it will cost a typical household $900 a year and that the council rushed the vote. [S1, S2, S9 opinion]


    A fire broke out early Tuesday at a vacant warehouse on Kettle Street. An initial report said two firefighters were injured, but Fire Chief Ama Mensah later said one firefighter was treated for smoke inhalation and released, and the earlier reports were incorrect. Crews had the fire under control by 9:15 a.m.; the cause is under investigation. [S3, S4]


    Supporters of a proposed rent stabilization ordinance rallied outside City Hall on Monday evening. Ledger reporters at the scene estimated the crowd at about 300. Organizers said more than 1,000 people attended. Police estimated 400. [S5, S6]


    The legislature passed a bill raising the minimum teacher salary to $48,500, by 39-28 in the Senate and 81-52 in the House. Governor Lena Ruiz is expected to sign it this week, a spokesperson said, and the increase would take effect in the fall term. [S7]


    Veloria''s central bank raised its benchmark interest rate by 0.25 percentage points to 3.75%, its third increase this year, citing inflation of 4.1%. [S8]


