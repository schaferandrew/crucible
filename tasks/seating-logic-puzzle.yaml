id: seating-logic-puzzle
name: Seating logic puzzle
aliases:
- MATH-4
needs_tools: false
category: reasoning
area: math
tier: temper
version: 2
rubric_version: 2
status: active
auto_grade: true
repo: null
prompt: |
  You are given a puzzle you have not seen before. Solve it carefully and explain the reasoning. Before giving the final answer, state any assumptions the puzzle requires. If the wording is ambiguous, identify the ambiguity rather than silently choosing an interpretation.

  Four friends — Alice, Bob, Carol, and Dave — sit in a row of four chairs numbered 1 to 4 from left to right. Each friend has a different favorite color: red, blue, green, or yellow. Use these clues to determine who sits in chair 3:

  1. Alice sits immediately to the left of the person who likes blue.
  2. Bob does not sit in chair 4.
  3. The person who likes green sits in chair 1.
  4. Carol likes yellow and sits somewhere to the right of the person who likes red.
  5. Dave likes red.

  End with the full seating, one line per chair in the form `Chair 1: <name>, <color>`, then a last line `ANSWER: <name of the person in chair 3>`.
checks:
  - id: answer
    type: required_patterns
    patterns: ['(?im)^\W*answer:\W*dave\b']
    rule: "The last line names Dave as the person in chair 3."
  - id: no_wrong_answer
    type: forbidden_patterns
    patterns: ['(?im)^\W*answer:\W*(alice|bob|carol)\b']
    rule: "The answer line doesn't name anyone else."
  - id: seating
    type: required_patterns
    patterns: ['(?im)^\W*chair\s*1\W+alice\W+green\b', '(?im)^\W*chair\s*2\W+bob\W+blue\b', '(?im)^\W*chair\s*3\W+dave\W+red\b', '(?im)^\W*chair\s*4\W+carol\W+yellow\b']
    rule: "The full seating is right: Alice green in 1, Bob blue in 2, Dave red in 3, Carol yellow in 4."
  - id: assumptions
    type: required_patterns
    patterns: ['\bassum']
    rule: "States its assumptions (for example, that 'left' means a lower-numbered chair) rather than leaving them silent."
rubric:
  - criterion: "Correct answer"
    max_score: 4
    check: answer
    description: "Dave is in chair 3."
  - criterion: "No other answer"
    max_score: 1
    check: no_wrong_answer
    description: "The answer line names no one else."
  - criterion: "Full seating"
    max_score: 4
    check: seating
    description: "Every chair's person and color is right, which shows the deduction actually worked."
  - criterion: "Assumptions stated"
    max_score: 1
    check: assumptions
    description: "Assumptions are stated, not silent."
critical_failure: null
hidden_answer: "Alice(green,1), Bob(blue,2), Dave(red,3), Carol(yellow,4). Chair 3 is Dave."
