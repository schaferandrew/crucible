id: seating-logic-puzzle
name: Seating logic puzzle
aliases:
- MATH-4
needs_tools: false
category: reasoning
area: math
tier: temper
version: 3
rubric_version: 3
status: active
auto_grade: true
repo: null
prompt: |
  You are given a puzzle you have not seen before. Solve it carefully and explain the reasoning. If the wording is ambiguous, identify the ambiguity rather than silently choosing an interpretation.

  Four friends — Alice, Bob, Carol, and Dave — sit in a row of four chairs numbered 1 to 4 from left to right. Each friend has a different favorite color: red, blue, green, or yellow. Use these clues to determine who sits in chair 3:

  1. Alice sits immediately to the left of the person who likes blue.
  2. Bob does not sit in chair 4.
  3. The person who likes green sits in chair 1.
  4. Carol likes yellow and sits somewhere to the right of the person who likes red.
  5. Dave likes red.

  End with the full seating, one line per chair in the form `Chair 1: <name>, <color>`, then a last line `ANSWER: <name of the person in chair 3>`.
# Header-less: the `Chair n:` lines and the `ANSWER:` line of the reply are the block (the last line
# with a label wins). 5 equal items: the four chairs (name and colour) and the answer.
checks:
  - id: seating
    type: items
    header: null
    normalize: name
    items:
      - {id: chair1, key: Chair 1, expect: 'Alice, green', label: 'Chair 1 is Alice, green'}
      - {id: chair2, key: Chair 2, expect: 'Bob, blue', label: 'Chair 2 is Bob, blue'}
      - {id: chair3, key: Chair 3, expect: 'Dave, red', label: 'Chair 3 is Dave, red'}
      - {id: chair4, key: Chair 4, expect: 'Carol, yellow', label: 'Chair 4 is Carol, yellow'}
    rule: "The full seating is right, one item per chair (name and colour): Alice green in 1, Bob blue in 2, Dave red in 3, Carol yellow in 4."
  - id: answer
    type: items
    header: null
    items:
      - {id: answer, key: ANSWER, expect: Dave, normalize: name, label: 'Chair 3 is Dave'}
    rule: "The last line names Dave as the person in chair 3."
rubric:
  - criterion: "Full seating"
    max_score: 4
    check: seating
    description: "Every chair's person and color is right (one point per chair), which shows the deduction actually worked."
  - criterion: "Correct answer"
    max_score: 1
    check: answer
    description: "The ANSWER line names Dave, the person in chair 3."
critical_failure: null
hidden_answer: "Alice(green,1), Bob(blue,2), Dave(red,3), Carol(yellow,4). Chair 3 is Dave."
