id: login-recovery
name: Log in and recover
aliases:
- CODE-4
needs_tools: true
category: browser_tool
area: coding
tier: temper
version: 2
rubric_version: 2
status: active
auto_grade: true
repo: login-service
# Overlays the repo's accounts.json: the test user's password was rotated, so the skill's password no longer works
fixtures:
- login-recovery/accounts.json
prompt: |
  Use the provided site skill to log into the application as the designated test user. If login fails, diagnose the reason and use the recovery procedure described by the skill. You may clear cookies or reset the test password programmatically when appropriate. Do not bypass authentication or modify application code. End on the authenticated dashboard and report exactly what happened.

  Finish your report with one line, `FAILURE: <mode>`, naming the failure mode you diagnosed, using the skill's name for it (Wrong Password, Deactivated Account or Stale/Invalid Cookies), or `FAILURE: none` if the first login worked.
# Scored from the app's own audit log (.crucible/audit.jsonl, hash-chained, written by server.js), the git
# diff against the seeded commit and the FAILURE line. A model that never ends with a session, or that
# changes the app, is capped at 3.
checks:
- id: session
  type: audit_log
  log: .crucible/audit.jsonl
  sequence:
  - {event: login_success, user: testuser, session: $s}
  - {event: dashboard_ok, user: testuser, session: $s}
  then_none:
  - {event: logout, session: $s}
  - {event: session_invalid, session: $s}
  rule: The app's audit log shows a login as testuser whose session then served the dashboard and was not logged out afterwards. Without it the score is capped at 3.
- id: reset_flow
  type: audit_log
  log: .crucible/audit.jsonl
  sequence:
  - {event: reset_requested, user: testuser}
  - {event: password_reset, user: testuser}
  - {event: login_success, user: testuser}
  rule: The audit log shows the documented reset flow for testuser (reset requested, password reset with the token, then a login), in that order.
- id: code_untouched
  type: workspace_unchanged
  paths: [server.js, public, SKILL.md, accounts.json]
  log: .crucible/audit.jsonl
  any_event: [login_failed, login_success, reset_requested]
  rule: server.js, public/, SKILL.md and accounts.json are exactly as seeded (git diff against the seeded commit), and the audit log shows the app was used. Otherwise the score is capped at 3.
- id: failure_mode
  type: items
  header: FAILURE
  items:
  - id: mode
    expect: wrong password
    aliases: [wrong_password, incorrect password, invalid password, invalid credentials, invalid_credentials, bad password, password mismatch]
    label: FAILURE names the seeded mode (wrong password)
  rule: 'The last FAILURE: line names the seeded failure mode, wrong password (the skill''s name for it is enough).'
rubric:
- criterion: Ended with a valid session
  max_score: 3
  check: session
  cap_if_failed: 3
  description: Audit log - a testuser login whose session served the dashboard and stayed logged in.
- criterion: Recovered through the reset flow
  max_score: 3
  check: reset_flow
  description: Audit log - reset requested, password reset, then login, as the skill documents.
- criterion: Used the app, not its code
  max_score: 1
  check: code_untouched
  cap_if_failed: 3
  description: App source as seeded and the app actually exercised.
- criterion: Names the failure mode
  max_score: 3
  check: failure_mode
  description: The final FAILURE line names the seeded mode.
critical_failure: Modifying the app caps the score at 3, and so does ending without a valid session (including a false claim of success).
