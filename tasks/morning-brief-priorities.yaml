id: morning-brief-priorities
name: Morning brief, prioritized
aliases:
- TASK-3
needs_tools: true
category: long_agent
area: everyday
tier: temper
version: 3
rubric_version: 2
status: active
auto_grade: true
repo: null
mcp_servers:
  - mock-data
prompt: |
  Today is Wednesday, September 2, 2026. Produce my morning brief using only the supplied sources for weather, email, calendar and news. If a source is unavailable, say so instead of inventing information.

  Write the brief as Markdown with exactly these `##` sections, in this order:

  ## Weather
  ## Outstanding work
  ## Emails
  ## Calendar
  ## News
  ## Top 3 things to do today

  "Outstanding work" is whatever yesterday's emails left open. In every section, prioritize what actually requires attention today rather than summarizing everything: highlight conflicts, deadlines, unanswered messages and actions, and keep facts separate from recommendations. "Top 3 things to do today" is a numbered list of exactly three items.
checks:
- id: sections
  type: items
  header: null
  items:
  - id: order
    normalize: sections
    expect:
    - Weather
    - [Outstanding work, Open work]
    - [Emails, Email]
    - Calendar
    - News
    - [Top 3 things to do today, Top 3, Top three]
  rule: 'The reply has a ## heading for Weather, Outstanding work, Emails, Calendar, News and Top 3 things to do today, in that order; one item per section.'
- id: top3
  type: items
  header: null
  items:
  - {id: count, normalize: count, expect: 3, section: [Top 3 things to do today, Top 3, Top three], top_level: true, label: 'Top 3 has exactly 3 items'}
  rule: 'The Top 3 section holds exactly three list items (sub-bullets under an item do not count).'
- id: must_act
  type: items
  header: null
  items:
  - {id: conflict, normalize: mention, source: events, only: [Planning, Vendor demo], also: 'conflict|overlap|clash|double.?book|collid|simultaneous', label: 'Flags the Planning / Vendor demo conflict'}
  - {id: deadline, normalize: mention, source: emails, only: ['Reminder: Q3 expense report due Wednesday 5 PM'], label: 'Flags the expense report deadline'}
  - {id: unanswered, normalize: mention, source: emails, only: [Question about the proposal timeline], label: 'Flags the unanswered proposal question'}
  rule: 'The brief mentions each must-act item: the 10:00 Vendor demo overlapping the 9:30 Planning (named together with a word like conflict or overlap), the Q3 expense report due at 5 PM, and the client''s unanswered question about the proposal timeline. If none of the three is mentioned, the score is capped at 5.'
- id: grounded
  type: grounded_numbers
  sources: [mock-data]
  rule: 'Every figure of 11 or more in the reply appears in the mock weather, email, calendar or news data (list numbers and small counts are ignored; whole hours also count as 24-hour times).'
rubric:
- {criterion: Sections in order, max_score: 6, check: sections, description: 'Weather, Outstanding work, Emails, Calendar, News and Top 3 things to do today headings, in order.'}
- {criterion: Top 3 has three items, max_score: 1, check: top3, description: 'Exactly three items under the Top 3 heading.'}
- {criterion: Must-act items surfaced, max_score: 3, cap_if_failed: 5, check: must_act, description: 'The calendar conflict, the deadline and the unanswered email are each mentioned; mentioning none caps the score at 5.'}
- {criterion: Numbers from the sources, max_score: 1, check: grounded, description: 'No figure that is not in the mock data.'}
critical_failure: null
