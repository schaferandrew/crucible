prompt: |
  Three logic puzzles, each with exactly one solution. Solve each one, filling in every blank (shown as .), and report the rows of the solved grids.

  Puzzle A is a 9x9 sudoku: fill the grid so that every row, every column and every 3x3 box contains each of the digits 1 to 9 exactly once. Spaces and blank lines in the drawing only mark the boxes.

  ```
  ..1 ... ..3
  7.. .3. .4.
  .9. .41 .62

  5.. ... .37
  .4. ... ..6
  ... 5.8 ...

  ... 4.. .2.
  6.. ..3 ..5
  8.9 6.. ...
  ```

  Puzzle B is a 9x9 anti-knight sudoku: the same rules as Puzzle A, plus one more. Two cells a chess knight's move apart (two cells along a row or column and then one cell at a right angle, such as row 1 column 1 and row 2 column 3, or row 1 column 1 and row 3 column 2) never contain the same digit.

  ```
  .5. .1. ...
  ... ..5 ...
  31. ..7 ..4

  ... ... 84.
  ... .4. ...
  .4. ... ...

  ... 972 ...
  ... 6.. ..9
  .3. ..4 7.5
  ```

  Puzzle C is a 6x6 irregular sudoku: every row and every column contains each of the digits 1 to 6 exactly once, and so does each of the six regions. The region map has the same layout as the grid, and cells with the same letter (U to Z) are in the same region.

  Grid:
  ```
  ..2...
  ......
  ...1.3
  ....6.
  ..4...
  ......
  ```

  Region map:
  ```
  UUUVVV
  WUUVVX
  WWUVXX
  YWXXXZ
  YWWZZZ
  YYYYZZ
  ```

  Questions 1 to 9 are the rows of solved Puzzle A, top to bottom. Questions 10 to 18 are the rows of solved Puzzle B, top to bottom. Questions 19 to 24 are the rows of solved Puzzle C, top to bottom. Answer each with that row's digits from left to right, written as one number with no spaces or separators: nine digits for Puzzles A and B (such as 123456789), six for Puzzle C (such as 123456).

  Explain your reasoning first if it helps. Then end your reply with this block, and nothing after it:

  ANSWERS:
  <number>: <answer>

  One line per numbered question, in order. Give only the answer (a number, name or letter), not a sentence.
# Only the last ANSWERS block is scored: 24 equal items, one per row (9 + 9 + 6), each criterion worth its item count.
# The `number` normalizer reads the first number on each line, spaces removed, so 481296753 and 481 296 753 both
# read as 481296753; rows hold digits 1-9 only, so a row can never start with 0. Puzzles generated fresh by
# a seeded script and proved unique twice (propagating search and plain backtracking); A and C are minimal.
