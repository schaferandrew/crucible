id: interest-calculator-cli
name: Interest calculator CLI
aliases:
- CODE-1b
needs_tools: true
category: coding_build
area: coding
tier: temper
version: 2
rubric_version: 2
status: active
auto_grade: true
repo: null
prompt: |
  Build a command-line compound-interest calculator in Python 3, standard library only (no third-party packages). Work in the current directory: the package goes in interest/ and the tool runs from this directory as `python -m interest`.

  Flags
  - --principal AMOUNT (required): the starting balance, zero or more.
  - --rate PERCENT (required): the annual interest rate in percent, so 5 means 5%. Zero or more.
  - --years N or --months N: the time, a positive whole number. Give exactly one of them.
  - --compound {annually,quarterly,monthly,daily} (required): 1, 4, 12 or 365 compounding periods a year.
  - --contribution AMOUNT and --contribution-frequency {monthly,annually} (optional, but given together): that amount, greater than zero, is added at the end of every month or every year.
  - --json: print JSON instead of the summary.

  Interest is credited at the end of each compounding period (the annual rate divided by the periods a year, applied to the balance at that moment). A contribution is added at the end of its period, after any interest credited at that same moment.

  Output
  - By default, print a readable summary showing the principal, total contributions, interest earned and final balance.
  - With --json, print one JSON object and nothing else: {"principal": ..., "total_contributions": ..., "interest_earned": ..., "final_balance": ...}, each a number rounded to cents.

  Errors
  - Invalid, negative or contradictory input (a value that is not a number, a negative amount, both --years and --months or neither, a contribution without a frequency or the reverse, an unknown compounding or frequency) exits with a non-zero status and a short message on stderr, not a traceback.

  Tests and docs
  - Write automated tests in tests/ (pytest or unittest) covering ordinary cases, zero interest, monthly compounding, recurring contributions at both frequencies, invalid input and a known expected-value case. They must pass when run from this directory.
  - Write README.md with how to run the tool and command examples.
scoring: per_test
grader: interest-calculator-cli
rubric:
  - criterion: Compound-interest math
    hidden_tests: math
    cap_if_failed: 4
    description: 'Hidden tests, known values computed independently: monthly, annual, quarterly and daily compounding, zero rate, years versus months, contributions at both frequencies. The core requirement: its tests earn their points, and if any one is off by more than a cent the score is capped at 4.'
  - criterion: Output
    hidden_tests: output
    description: 'Hidden tests: the default summary shows the four figures; --json prints exactly the four keys, rounded to cents, consistent.'
  - criterion: Input validation
    hidden_tests: validation
    description: 'Hidden tests: invalid, negative and contradictory input exits non-zero with a message on stderr and no traceback (each next to a valid control run).'
  - criterion: Own tests
    hidden_tests: own tests
    description: 'One test in the pool: the tests the model wrote in tests/ run and pass.'
  - criterion: README
    hidden_tests: readme
    description: 'One test in the pool: README.md has at least one `python -m interest ...` command example.'
