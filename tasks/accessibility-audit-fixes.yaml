id: accessibility-audit-fixes
name: Accessibility audit fixes
aliases:
- CODE-15
needs_tools: true
category: browser_tool
area: coding
tier: forge
version: 1
rubric_version: 3
status: provisional
auto_grade: true
repo: conduit-a11y
grader: accessibility-audit-fixes
# Every hidden test weighs the same: the score is tests passed / all tests x 10, graded in a fresh
# copy of the seeded repo with only the model's apps/web/src (graders/accessibility-audit-fixes/
# grader.yaml). The existing tests and the untouched contract suite are caps, not points: the seeded
# repo passes both, so doing nothing scores 0.
scoring: per_test
prompt: |
  This is Conduit, a RealWorld (realworld.how) monorepo: an Express API in apps/api, a React app in apps/web, and shared types in packages/shared. Read README.md first.

  Conduit just failed an external accessibility audit, and we can't sign a public-sector contract until it passes. The auditor's summary is in docs/accessibility-audit.md. Fix every finding in the web app so keyboard and screen reader users can do everything mouse users can.

  Constraints:
  - Keep the visual design the same.
  - Keep each component's name, file and props as they are (other teams import them); change their internals freely.
  - Prefer native HTML elements and behavior; where a custom widget is genuinely needed, follow the WAI-ARIA Authoring Practices pattern for it.
  - Don't fix one finding in a way that creates another.
  - axe-core is installed in apps/web. Add tests that would have caught each finding (keyboard interaction and announcements, not only axe), and keep every existing test passing.

  Finish with a summary of each finding, what you changed, and anything you couldn't verify without a real screen reader.
rubric:
- criterion: Dialog
  hidden_tests: finding 1
  description: 'Hidden tests: a named modal dialog that takes focus, keeps Tab inside, works from the keyboard, closes on Escape, returns focus and has no axe violations.'
- criterion: Read more
  hidden_tests: finding 2
  description: 'Hidden tests: a keyboard control (Enter and Space) that reports its expanded state both ways, reveals text where it''s heard and has no axe violations.'
- criterion: Tag filter
  hidden_tests: finding 3
  description: 'Hidden tests: named, usable entirely from the keyboard, can clear the filter, shows and marks the selection, Escape returns focus, no axe violations.'
- criterion: Button names
  hidden_tests: finding 4
  description: 'Hidden tests: the favorite button is named, reports on and off, keeps the count for screen readers, and has no axe violations.'
- criterion: Form errors
  hidden_tests: finding 5
  description: 'Hidden tests: invalid fields (title, description, body) are marked and read with every error; valid fields are left alone; no axe violations.'
- criterion: Status messages
  hidden_tests: finding 6
  description: 'Hidden tests: confirmations go through a live region that exists before the message, persists, and is the one the editor uses.'
- criterion: Regression tests
  hidden_tests: regression
  description: 'One test in the pool: the model''s new or changed tests pass on its fix, and at least one fails on the seeded code.'
- criterion: Existing tests still pass
  hidden_tests: existing
  cap_if_failed: 5
  description: The repo's seeded API and web tests pass on the model's source; if not, the score is capped at 5. A cap, not points.
- criterion: Contract suite untouched
  hidden_tests: contract_unchanged
  cap_if_failed: 4
  description: apps/api/test/realworld.contract.test.ts is exactly as seeded; modifying it caps the score at 4. A cap, not points.
critical_failure: Every hidden test weighs the same; the score is tests passed / all tests x 10. Failing the seeded tests caps it
  at 5, and modifying the contract suite caps it at 4. Write-ups aren't scored.
