id: landlocked-countries
name: Landlocked countries
aliases:
- GEOG-2
needs_tools: false
category: geography
area: geography
tier: temper
version: 2
rubric_version: 2
status: provisional
auto_grade: false
repo: null
prompt: 'Which of these countries are landlocked (no coastline on the open ocean or a sea connected to it)?


  Croatia, Bolivia, Slovenia, Kazakhstan, Eritrea, Austria, Jordan, Laos, Mozambique, Paraguay, Bosnia and Herzegovina,
  Serbia, Vietnam, Ethiopia, Togo, Uzbekistan, Zambia, Iraq, Hungary, DR Congo, Mongolia, Belgium

  Then say which one of them is doubly landlocked (surrounded only by landlocked countries).


  Answer in exactly three lines:

  Landlocked: <countries, comma-separated>

  Not landlocked: <countries, comma-separated>

  Doubly landlocked: <country>

  '
# Header-less: the three labelled lines of the reply are the block (the last line with a label wins).
# 23 equal items: each of the 11 landlocked countries on the Landlocked line (and not on the other), each
# of the 11 coastal ones (7 look landlocked: Bosnia and Herzegovina, DR Congo, Jordan, Iraq, Slovenia, Togo,
# Belgium) on the Not landlocked line (and not on the other), and the doubly landlocked one.
checks:
- id: landlocked_found
  type: items
  header: null
  items:
  - id: landlocked
    key: Landlocked
    not_in: [Not landlocked]
    normalize: name_set
    expect: [Bolivia, Kazakhstan, Austria, Laos, Paraguay, Serbia, Ethiopia, Uzbekistan, Zambia, Hungary, Mongolia]
    aliases: {Laos: [Lao PDR]}
  rule: 'Lists each of the 11 landlocked countries on the Landlocked line, and not on the Not landlocked line: Bolivia,
    Kazakhstan, Austria, Laos, Paraguay, Serbia, Ethiopia, Uzbekistan, Zambia, Hungary, Mongolia; one item per country.'
- id: coastal_not_listed
  type: items
  header: null
  items:
  - id: coastal
    key: Not landlocked
    not_in: [Landlocked]
    normalize: name_set
    expect: [Croatia, Eritrea, Mozambique, Vietnam, Slovenia, Jordan, Bosnia and Herzegovina, Togo, Iraq, DR Congo, Belgium]
    aliases: {DR Congo: [Democratic Republic of the Congo, DRC, Congo-Kinshasa], Bosnia and Herzegovina: [Bosnia, Bosnia-Herzegovina]}
  rule: 'Lists each coastal country on the Not landlocked line, and not on the Landlocked line: Croatia, Eritrea,
    Mozambique, Vietnam, Slovenia, Jordan, Bosnia and Herzegovina, Togo, Iraq, DR Congo, Belgium; one item per country.'
- id: doubly
  type: items
  header: null
  items:
  - {id: doubly, key: Doubly landlocked, expect: Uzbekistan, normalize: name, label: 'Doubly landlocked is Uzbekistan'}
  rule: The doubly landlocked country is Uzbekistan.
rubric:
- criterion: All landlocked found
  max_score: 11
  check: landlocked_found
  description: Each of the 11 landlocked countries is on the Landlocked line and not on the other (one point each).
- criterion: Coastal countries on the right line
  max_score: 11
  check: coastal_not_listed
  description: Each of the 11 coastal countries (Croatia, Eritrea, Mozambique, Vietnam and the look-alikes Slovenia, Jordan, Bosnia and Herzegovina, Togo, Iraq, DR Congo, Belgium) is on the Not landlocked line and not on the other
    (one point each).
- criterion: Doubly landlocked
  max_score: 1
  check: doubly
  description: The doubly landlocked country is Uzbekistan.
critical_failure: null
