id: fact-check-history
name: Fact-check twelve history claims
aliases:
- HIST-2
needs_tools: false
category: history
area: history
tier: temper
version: 2
rubric_version: 2
status: provisional
auto_grade: false
repo: null
prompt: |
  Fact-check these claims before they go in a newsletter. Some of them are wrong and some are right.

  1. The Battle of Hastings was fought in 1066.
  2. In 1215, King Richard sealed Magna Carta at Runnymede.
  3. Christopher Columbus first reached the Americas in 1493.
  4. The United States Declaration of Independence was adopted on July 4, 1776.
  5. Crowds in Paris stormed the Bastille in July 1789.
  6. Napoleon was finally defeated at the Battle of Waterloo in 1812.
  7. The Titanic sank in April 1913.
  8. India gained independence from Britain in August 1947.
  9. Neil Armstrong and Buzz Aldrin landed on the Moon in July 1969.
  10. The Berlin Wall fell in November 1991.
  11. Germany was reunified in the year after the Berlin Wall fell.
  12. Nelson Mandela was elected President of South Africa in 1994.

  Explain your reasoning first if it helps. Then end your reply with this block, and nothing after it:

  ERRORS:
  <number>: <corrected value>

  One line per inaccurate numbered item, and none for accurate ones. Give only the corrected value (a year,
  number or name), not a sentence. If every item is accurate, write `ERRORS: none`.
# Only the last ERRORS: block is scored, as 17 equal items: lines 2, 3, 6, 7 and 10 listed, each with
# the right correction, and the seven accurate lines (1, 4, 5, 8, 9, 11, 12) left out. Flagging every
# line scores at most 10/17 (5.88), flagging none 7/17 (4.12). Three checks read the same block so
# the score record shows the three groups.
checks:
- id: errors_found
  type: items
  header: [ERRORS, ERROR]
  items:
  - {id: listed, expect: [2, 3, 6, 7, 10], of: [2, 3, 6, 7, 10], normalize: line_set}
  rule: 'Lists each inaccurate claim (2, 3, 6, 7 and 10) in the ERRORS: block; one item per line.'
- id: corrections
  type: items
  header: [ERRORS, ERROR]
  normalize: year
  items:
  - {id: king, key: '2', expect: John, normalize: name, aliases: [King John, John of England, King John of England],
     label: 'Line 2 corrected to King John'}
  - {id: columbus, key: '3', expect: 1492, label: 'Line 3 corrected to 1492'}
  - {id: waterloo, key: '6', expect: 1815, label: 'Line 6 corrected to 1815'}
  - {id: titanic, key: '7', expect: 1912, label: 'Line 7 corrected to 1912'}
  - {id: berlin_wall, key: '10', expect: 1989, label: 'Line 10 corrected to 1989'}
  rule: 'Corrects each one to its value alone: 2 to (King) John, 3 to 1492, 6 to 1815, 7 to 1912, 10 to 1989;
    one item per correction.'
- id: accurate_kept
  type: items
  header: [ERRORS, ERROR]
  items:
  - {id: listed, expect: [], of: [1, 4, 5, 8, 9, 11, 12], normalize: line_set}
  rule: 'Leaves the accurate claims (1, 4, 5, 8, 9, 11 and 12) out of the ERRORS: block; one item per claim.'
rubric:
- criterion: Errors found
  max_score: 5
  check: errors_found
  description: Each of the five inaccurate claims is listed (one point each).
- criterion: Corrections
  max_score: 5
  check: corrections
  description: Each listed claim has the right corrected value (one point each).
- criterion: Accurate claims left alone
  max_score: 7
  check: accurate_kept
  description: Each of the seven accurate claims is left out (one point each).
critical_failure: null
