id: cache-leak-incident
name: Cache leak incident
aliases:
- CODE-13
needs_tools: true
category: coding_debug
area: coding
tier: forge
version: 3
rubric_version: 4
status: active
auto_grade: true
repo: conduit-incident
grader: cache-leak-incident
# Every hidden test weighs the same: the score is tests passed / all tests x 10, graded in a fresh copy of
# the seeded repo with only the model's source folders and incident/POSTMORTEM.md (graders/cache-leak-incident/
# grader.yaml). The postmortem's four fixed lines are four tests. The existing tests and the untouched
# contract suite are caps, not points.
scoring: per_test
prompt: |
  You're on call for Conduit, a RealWorld (realworld.how) monorepo: an Express API in apps/api, a React app in apps/web, shared code in packages/shared. Read README.md first.

  Support escalated this ticket this morning:

    "Since yesterday's deploy, several users report that articles show as 'favorited' when they never favorited them, and the follow button shows the wrong state on author profiles. Two authors also say edits to their articles don't show up for a while, and one says a deleted article was still readable. It isn't consistent: refreshing sometimes fixes it."

  The production logs from the last two days are in incident/logs/ (API access log, application log, deploy log). They're large, so search them rather than reading them end to end. incident/ticket-notes.md has what support collected.

  Do all of the following:
  1. Find the root cause (or causes) and confirm each one against the logs.
  2. Fix it properly in the code. Keep the intent of the change that introduced it if that intent is sound, and don't just revert or disable things wholesale. Keep createApp(db, options) and the way server.ts calls it working as they do today, with the options it takes now: our other tooling builds the app through it.
  3. Add regression tests that fail before your fix and pass after it. Keep every existing test passing, including apps/api/test/realworld.contract.test.ts, unmodified.
  4. Write incident/POSTMORTEM.md covering: a timeline with timestamps taken from the logs (deploy, first affected request, first user report), the root cause, how many distinct users were served another user's personalized data (count it from the logs, and say how you counted), impact, the fix, and follow-up actions.

  Start the postmortem with these four lines, exactly in this form, with times as HH:MM:SS (UTC, from the logs) and a whole number of users:

    Deploy: HH:MM:SS
    First affected request: HH:MM:SS
    First report: HH:MM:SS
    Affected users: <n>

  "First affected request" is the first request served from stored data that was built for a different signed-in user. Count signed-in users only, or, if you also count responses stored by anonymous requests, say so in the postmortem.
rubric:
- criterion: Per-viewer fields
  hidden_tests: per-viewer fields
  description: 'Hidden tests: favorited and following are never shared between viewers, on articles, lists and profiles.'
- criterion: Writes visible immediately
  hidden_tests: writes are visible
  description: 'Hidden tests: updates, deletes, favorites, follows and new articles show at once.'
- criterion: Postmortem lines
  hidden_tests: postmortem
  description: 'Hidden tests, one per line: Deploy 16:42:10, First affected request 16:44:15, First report 18:06:01, Affected users 371 (or 481 with the method stated).'
- criterion: Regression tests
  hidden_tests: regression
  description: 'One test in the pool: the model''s new or changed tests pass on its fix, and at least one fails on the seeded code.'
- criterion: Existing tests still pass
  hidden_tests: existing
  cap_if_failed: 5
  description: The repo's seeded API and web tests pass on the model's source; if not, the score is capped at 5. A cap, not points.
- criterion: Contract suite untouched
  hidden_tests: contract_unchanged
  cap_if_failed: 4
  description: apps/api/test/realworld.contract.test.ts is exactly as seeded; modifying it caps the score at 4. A cap, not points.
critical_failure: Every hidden test weighs the same; the score is tests passed / all tests x 10. Failing the seeded tests caps it at 5, and modifying the contract suite caps it at 4.
