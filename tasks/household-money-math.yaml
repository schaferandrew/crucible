repo: null
prompt: 'Everyday money and measurement questions. Show your working, and round only at the end.


  1. I put $5,000 in a savings account paying 4% a year, compounded monthly. What is it worth after exactly 3 years, to the
  cent?

  2. I''m flooring a 1,850 sq ft space. Flooring comes in boxes of 23.5 sq ft and I need 10% extra for waste. How many boxes
  do I buy?

  3. A 412-mile road trip in a car that gets 34 miles per gallon, with gas at $3.89 a gallon. What does the gas cost, to the
  cent?

  4. Dinner came to $186.40 including tax; the pre-tax amount was $172.00. We tip 18% on the pre-tax amount and split the
  total four ways. What does each person pay, to the cent?


  End with a section headed ANSWERS, one line per question in the form `1. <answer>`.

  '
# Only the ANSWERS block is scored: four equal items, one per question (each criterion is one point).
checks:
- id: interest
  type: items
  header: ANSWERS
  items:
  - {id: interest, key: '1', expect: 5636.36, normalize: money, label: 'Answer 1 is $5,636.36'}
  rule: Answer 1 is $5,636.36 (monthly compounding, 36 periods).
- id: boxes
  type: items
  header: ANSWERS
  items:
  - {id: boxes, key: '2', expect: 87, normalize: number, label: 'Answer 2 is 87 boxes'}
  rule: Answer 2 is 87 boxes (2,035 sq ft, rounded up).
- id: gas
  type: items
  header: ANSWERS
  items:
  - {id: gas, key: '3', expect: 47.14, normalize: money, label: 'Answer 3 is $47.14'}
  rule: Answer 3 is $47.14.
- id: split
  type: items
  header: ANSWERS
  items:
  - {id: split, key: '4', expect: 54.34, normalize: money, label: 'Answer 4 is $54.34'}
  rule: Answer 4 is $54.34 each (tip on the pre-tax amount, added to the taxed total).
rubric:
- criterion: Compound interest
  max_score: 1
  check: interest
  description: Answer 1 is $5,636.36 (monthly compounding, 36 periods).
- criterion: Boxes
  max_score: 1
  check: boxes
  description: Answer 2 is 87 boxes (2,035 sq ft, rounded up).
- criterion: Gas cost
  max_score: 1
  check: gas
  description: Answer 3 is $47.14.
- criterion: Split bill
  max_score: 1
  check: split
  description: Answer 4 is $54.34 each (tip on the pre-tax amount, added to the taxed total).
