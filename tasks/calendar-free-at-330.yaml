id: calendar-free-at-330
name: "Am I free at 3:30?"
aliases:
- TASK-4
needs_tools: true
mcp_servers:
  - mock-calendar:spark
category: everyday
area: everyday
tier: spark
version: 2
rubric_version: 2
status: provisional
auto_grade: true
repo: null
prompt: |
  Am I free at 3:30?

  Explain your reasoning first if it helps. Then end your reply with this block, and nothing after it:

  ANSWER: free|busy

  Write `free` or `busy` after the colon, and nothing else on that line. Say in your reasoning which day and time you checked.
checks:
- id: answer
  type: items
  header: ANSWER
  normalize: name
  items:
  - {id: free, expect: free, label: 'ANSWER is free'}
  rule: 'The ANSWER: line says free (the Design review ends at exactly 3:30, which is not a conflict).'
- id: states_time
  type: required_patterns
  min_matches: 1
  patterns: ['\bp\.?m\b', 'afternoon', 'today']
  rule: 'The reply says which time it checked: PM, this afternoon or today (3:30 AM has already passed).'
- id: grounded
  type: tool_calls
  items:
  - {id: time, tool: get_current_time, label: 'Called get_current_time'}
  - {id: events, tool: list_events, label: 'Called list_events'}
  rule: 'The run called get_current_time and list_events (read from the session, not the reply).'
rubric:
- {criterion: Correct answer, max_score: 1, check: answer, description: 'The ANSWER line says free.'}
- {criterion: States its assumption, max_score: 1, check: states_time, description: 'Says PM, this afternoon or today.'}
- {criterion: Grounded in the calendar, max_score: 2, check: grounded, description: 'Called get_current_time and list_events.'}
