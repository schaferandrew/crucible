prompt: 'A letter has turned up, dated June 10, 1863, written by a farmer in Ohio. It mentions the following. Which of them
  could the writer NOT have known about or done on that date? Explain each briefly.


  a) The Emancipation Proclamation taking effect this New Year''s Day

  b) The siege of Vicksburg dragging on

  c) News of Lee''s defeat at Gettysburg

  d) The telegraph bringing news from Washington

  e) The Monitor''s fight with the Merrimack last year

  f) A cousin in Cleveland who telephoned with the news

  g) Fencing the north pasture with barbed wire

  h) Mathew Brady''s photographs of the dead at Antietam

  i) Stonewall Jackson''s death last month

  j) West Virginia, which joined the Union last month

  k) The draft riots in New York


  Finish with one line listing only the anachronisms, as letters in alphabetical order:

  ANACHRONISMS: <letters, comma-separated>

  '
checks:
- id: all_found
  type: required_patterns
  patterns:
  - (?im)^\W*anachronisms:.*\bc\b
  - (?im)^\W*anachronisms:.*\bf\b
  - (?im)^\W*anachronisms:.*\bg\b
  - (?im)^\W*anachronisms:.*\bj\b
  - (?im)^\W*anachronisms:.*\bk\b
  rule: The final line includes c (Gettysburg, July), f (telephone, 1876), g (barbed wire, 1874), j (West Virginia, June 20)
    and k (draft riots, July).
- id: no_false_flags
  type: forbidden_patterns
  patterns:
  - (?im)^\W*anachronisms:.*\b[abdehi]\b
  rule: The final line includes none of a, b, d, e, h, i (all possible by June 10, 1863).
