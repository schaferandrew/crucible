id: calendar-team-of-16
name: An hour for a team of 16
aliases:
- TASK-6
needs_tools: true
mcp_servers:
  - mock-calendar:forge
category: long_agent
area: everyday
tier: forge
version: 2
rubric_version: 2
status: provisional
auto_grade: true
repo: null
prompt: |
  Find an hour in the next two weeks for a work meeting with everyone on my team. Give me your top three options.

  Explain your reasoning first if it helps. Then end your reply with this block, and nothing after it:

  OPTIONS:
  YYYY-MM-DD HH:MM <time zone>

  One line per option, in 24-hour time, with a time zone abbreviation or name (for example CDT or America/Chicago). Give exactly three options, best first.
checks:
- id: options_valid
  type: time_options
  header: OPTIONS
  dataset: forge
  team: Platform
  until: '2026-09-15T00:00:00'
  minutes: 60
  items:
  - {id: valid, kind: in_set, label: 'Every option is a time all 16 are free, in their business hours'}
  rule: 'Every OPTIONS line is a 60-minute start free for all 16 Platform calendars inside each person''s 9-5 weekday (computed from the dataset), with no repeats. Any other option caps the score at 4.'
- id: options_count
  type: time_options
  header: OPTIONS
  items:
  - {id: count, kind: count, min: 3, max: 3, label: 'Exactly three options'}
  rule: 'The OPTIONS block has exactly three lines.'
- id: constraints
  type: time_options
  header: OPTIONS
  dataset: forge
  minutes: 60
  items:
  - id: days
    kind: avoid
    dates: ['2026-09-07']
    ranges: [['2026-09-10', '2026-09-11']]
    label: 'None on Labor Day or while Priya is out'
  - {id: close, kind: latest_end, time: '16:00', label: 'None ends after 4 PM Central'}
  rule: 'No option falls on Labor Day (9/7) or on 9/10-9/11, and none ends after 16:00 Central (Marcus works 9-5 in New York).'
- id: team
  type: tool_calls
  items:
  - id: freebusy
    tool: get_freebusy
    covers: {dataset: forge, team: Platform}
    label: 'get_freebusy covered the 15 other Platform calendars'
  rule: 'The run''s get_freebusy calls (read from the session) named all 15 Platform calendars other than the user''s own.'
rubric:
- {criterion: Valid options, max_score: 1, cap_if_failed: 4, check: options_valid, description: 'Every option is a ground-truth start; a busy time, Labor Day, Priya out, or a time past 4 PM Central caps the score at 4.'}
- {criterion: Exactly three options, max_score: 1, check: options_count, description: 'The block has three options.'}
- {criterion: Handles the constraints, max_score: 2, check: constraints, description: 'Nothing on Labor Day or 9/10-9/11, nothing ending after 4 PM Central.'}
- {criterion: Identifies the team, max_score: 1, check: team, description: 'get_freebusy covered the 15 Platform calendars.'}
