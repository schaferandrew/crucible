id: geography-trick-questions
name: Geography trick questions
aliases:
- GEOG-3
needs_tools: false
category: geography
area: geography
tier: forge
version: 1
rubric_version: 1
status: provisional
auto_grade: false
repo: null
prompt: 'Six geography questions, each with a single answer. The obvious answer is wrong for several of them. Give a one-sentence
  justification for each.


  1. Which country is crossed by both the Equator and the Tropic of Capricorn?

  2. Which country has coastline on both the Red Sea and the Persian Gulf?

  3. What is the northernmost capital city of a sovereign state?

  4. Counting overseas territories, which country spans the most time zones?

  5. Which US state is closest to mainland Africa?

  6. Apart from the microstates inside Italy, which is the only landlocked country that borders exactly one other country?


  End with a section headed ANSWERS, one line per question in the form `1. <answer>`.

  '
checks:
- id: equator_capricorn
  type: required_patterns
  patterns:
  - (?im)^\W*1[.)]\s*.*\bbrazil\b
  rule: Answer 1 is Brazil.
- id: red_sea_gulf
  type: required_patterns
  patterns:
  - (?im)^\W*2[.)]\s*.*\bsaudi arabia\b
  rule: Answer 2 is Saudi Arabia.
- id: northern_capital
  type: required_patterns
  patterns:
  - (?im)^\W*3[.)]\s*.*\breykjav[ií]k\b
  rule: Answer 3 is Reykjavík (Nuuk's Greenland isn't sovereign).
- id: time_zones
  type: required_patterns
  patterns:
  - (?im)^\W*4[.)]\s*.*\bfrance\b
  rule: Answer 4 is France.
- id: closest_state
  type: required_patterns
  patterns:
  - (?im)^\W*5[.)]\s*.*\bmaine\b
  rule: Answer 5 is Maine.
- id: one_neighbor
  type: required_patterns
  patterns:
  - (?im)^\W*6[.)]\s*.*\blesotho\b
  rule: Answer 6 is Lesotho.
rubric:
- criterion: Equator and Capricorn
  max_score: 1
  check: equator_capricorn
  description: Answer 1 is Brazil.
- criterion: Red Sea and Gulf
  max_score: 1
  check: red_sea_gulf
  description: Answer 2 is Saudi Arabia.
- criterion: Northernmost capital
  max_score: 1
  check: northern_capital
  description: Answer 3 is Reykjavík (Nuuk's Greenland isn't sovereign).
- criterion: Most time zones
  max_score: 1
  check: time_zones
  description: Answer 4 is France.
- criterion: Closest state
  max_score: 1
  check: closest_state
  description: Answer 5 is Maine.
- criterion: One neighbor
  max_score: 1
