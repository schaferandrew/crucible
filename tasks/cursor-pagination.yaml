id: cursor-pagination
name: Cursor pagination
aliases:
- CODE-12
needs_tools: true
category: coding_repo
area: coding
tier: forge
version: 2
rubric_version: 4
status: provisional
auto_grade: true
repo: conduit-monorepo
grader: cursor-pagination
# Every hidden test weighs the same: the score is tests passed / all tests x 10, graded in a fresh
# copy of the seeded repo with only the model's source folders (graders/cursor-pagination/grader.yaml).
# The seeded API tests and the untouched contract suite are caps, not points: the seeded repo passes
# both, so doing nothing scores 0.
scoring: per_test
prompt: |
  This is Conduit, a RealWorld (realworld.how) monorepo: an Express API in apps/api, a React app in apps/web, and shared types and validation in packages/shared. Read README.md first.

  Offset pagination is breaking down: when articles are published or deleted while someone is paging, they see duplicates or miss articles entirely. Migrate the article lists, the feed and comments to cursor pagination, without breaking existing clients.

  API
  - GET /api/articles (with any of its filters) and GET /api/articles/feed accept `cursor` alongside `limit`. Responses gain `nextCursor`: an opaque string for the next page, or null on the last page. `articlesCount` keeps meaning the total that matches the filters.
  - Paging with cursors must never skip or repeat an article, even when articles are created, deleted or favorited between page requests. Order stays newest first.
  - Cursors are opaque to clients and must not be forgeable into something else: a malformed or tampered cursor is a 422 with the usual error envelope ({ "errors": { "cursor": [...] } }).
  - A cursor is only valid for the query that produced it. Using it with different filters (tag, author, favorited) or on a different endpoint is a 422.
  - Sending both cursor and offset is a 422.
  - Offset pagination keeps working exactly as before when no cursor is sent: apps/api/test/realworld.contract.test.ts must stay green and unmodified.
  - GET /api/articles/:slug/comments gains the same cursor paging (`limit`, `cursor`, `nextCursor`), newest first. Without limit or cursor it returns every comment, as today.

  Web app
  - Replace numbered pagination with a "Load more" button on every article list (home tabs and profile tabs), driven by nextCursor. Loaded articles stay on screen; the button disappears on the last page.
  - Comments on the article page load the same way.

  Shared types must describe the new response fields. Add tests that prove the no-skip/no-duplicate guarantee under concurrent writes, the validation rules and the new web behavior, and keep every existing test passing. When you're done, summarize what you changed and anything you'd flag in code review.
rubric:
- criterion: Cursor correctness
  hidden_tests: cursor paging
  cap_if_failed: 6
  description: 'Hidden tests: every article and comment once, newest first, stable under ties, creates, deletes and favorites between pages, on every filter and the feed. The core requirement: its tests earn their points, and if any of them fails the score is capped at 6.'
- criterion: Validation and safety
  hidden_tests: validation
  description: 'Hidden tests: malformed, tampered, mismatched and conflicting cursors are rejected with a 422 on cursor.'
- criterion: Backward compatibility
  hidden_tests: backward compatibility
  description: 'Hidden tests: offset paging, error handling and unpaged comments keep working while the cursor feature is present.'
- criterion: Web app
  hidden_tests: 'web'
  description: 'Hidden tests: Load more on the home tabs, profile tabs and comments, driven by nextCursor, keeping loaded items and disappearing on the last page.'
- criterion: Regression tests
  hidden_tests: regression
  description: 'One test in the pool: the model''s new or changed tests pass on its fix, and at least one fails on the seeded code.'
- criterion: Existing tests still pass
  hidden_tests: existing
  cap_if_failed: 5
  description: The repo's seeded API tests, the contract suite among them, pass on the model's source; if not, the score is capped at 5. A cap, not points. (The seeded web test for numbered pagination is excluded, since the brief replaces that behavior.)
- criterion: Contract suite untouched
  hidden_tests: contract_unchanged
  cap_if_failed: 4
  description: apps/api/test/realworld.contract.test.ts is exactly as seeded; modifying it caps the score at 4. A cap, not points.
critical_failure: Every hidden test weighs the same; the score is tests passed / all tests x 10. A cursor that skips or repeats (any cursor correctness test failing) caps it at 6, failing the seeded API tests caps it at 5, and modifying the contract suite caps it at 4. Write-ups aren't scored.
