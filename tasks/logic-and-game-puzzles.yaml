  type: items
  header: ANSWERS
  items:
  - {id: pile_no_repeat, key: '1', expect: 18, normalize: number, label: 'Answer 1 is 18'}
  rule: 'Answer 1 is 18 (second-player starts 1, 9, 13, 17, 25, then 26, 34, 42 + 17k; 23 if the no-repeat rule is ignored).'
