id: react-lead-form
name: React lead form
aliases:
- CODE-16
needs_tools: true
category: coding_debug
area: coding
tier: temper
version: 1
rubric_version: 1
status: active
auto_grade: true
repo: react-lead-form
grader: react-lead-form
# Every hidden test weighs the same: the score is tests passed / all tests x 10. The levels climb
# in difficulty and cascade (a form you can't type into fails most of what follows), but each test
# is scored on its own, so a form that submits but validates badly keeps what it reached.
scoring: per_test
prompt: |
  This is the website for Brightline Windows, a small Next.js 14 (App Router) app. Read README.md first.

  The quote request form at /contact is broken: the page fails to build, and even in development you can't type into the fields. Fix it, then finish the form so it's ready for real customers.

  Keep these element ids exactly; our end-to-end tests use them:
  - the form: `lead-form`; the fields: `lead-name`, `lead-email`, `lead-company`, `lead-message`; the submit button: `lead-submit`
  - an error for a field: `lead-name-error`, `lead-email-error`, `lead-message-error`, rendered only while that field has an error
  - after a successful submission: an element with id `lead-success` in place of the form

  What the form must do:
  1. /contact builds with `npm run build` and its HTML, form included, is rendered on the server. Keep `app/contact/LeadForm.tsx` as the form's default export.
  2. Every field shows what's typed into it. Tab moves through the fields in order, then to the button, and Enter in a field submits.
  3. Name, email and message are required; company is optional. A field holding only spaces counts as empty.
  4. On submit with problems: show each problem field's error (use the app's own messages, not the browser's popups), mark the field `aria-invalid="true"` with `aria-describedby` pointing at its error, move focus to the first field with an error, keep everything the user typed, and send nothing.
  5. With no problems, POST the lead as JSON (`name`, `email`, `company`, `message`) to /api/leads. Show `lead-success` only when the API accepts it; otherwise keep the form and what was typed.

  Email: be accommodating about what people type and strict about what's saved.
  - Accept what real people type: surrounding spaces, capital letters, plus addressing (`name+tag@`), dots in the name, subdomains, hyphens in domain names and long or new top-level domains.
  - Save one canonical form: trimmed and lowercased. Never save an address that isn't valid: one `@`, nothing empty around a dot, no spaces, domain labels of letters, digits and inner hyphens, and a top-level domain of at least two letters.

  The API (app/api/leads/route.ts) is the authority, because not every client is this form:
  - It trims every field, saves a missing company as an empty string, normalizes the email as above, and answers 201 with `{ "lead": <the saved lead> }`.
  - For any problem it answers 422 with `{ "errors": { "<field>": "<message>" } }` and saves nothing.

  Don't add dependencies, and only change files under app/ and lib/ (tests can go there too); package.json, the lockfile and the config files stay as they are. Run `npm test` and `npm run build` before you finish, and end with a short summary of what was wrong and what you changed.
rubric:
- criterion: Renders
  hidden_tests: 'level 1'
  description: 'Hidden tests: the production build succeeds and /contact serves the form from the server.'
- criterion: Typing
  hidden_tests: 'level 2'
  description: 'Hidden tests: fields show what is typed; tab order.'
- criterion: Submit
  hidden_tests: 'level 3'
  description: 'Hidden tests: posts the lead, shows success only when accepted, Enter submits; the API trims and saves.'
- criterion: Required fields
  hidden_tests: 'level 4'
  description: 'Hidden tests: errors with aria wiring, focus on the first error, values kept, nothing sent; the API refuses with 422.'
- criterion: Badly formed email
  hidden_tests: 'level 5'
  description: 'Hidden tests: the form and the API refuse an obviously broken address.'
- criterion: Email accepted as typed
  hidden_tests: 'level 6: email accepted'
  description: 'Hidden tests: spaces, capitals, plus addressing, subdomains and new TLDs get through the form.'
- criterion: Email saved strictly
  hidden_tests: 'level 6: email saved'
  description: 'Hidden tests: saved trimmed and lowercased; invalid addresses never saved, whatever the client sends.'
critical_failure: Every hidden test weighs the same; the score is tests passed / all tests x 10.
