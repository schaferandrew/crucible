prompt: 'Five problems, each with a single exact answer. Several have a tempting wrong answer, so check your reasoning before
  you commit. Give fractions in lowest terms.


  1. How many integers from 1 to 10,000 inclusive are divisible by 3 or by 7, but not by 21?

  2. What is the remainder when 7^2026 is divided by 100?

  3. In how many ways can a 2 x 12 board be tiled with 1 x 2 dominoes (placed either way) and 2 x 2 squares?

  4. Three fair six-sided dice are rolled. What is the probability that the largest number shown is exactly 4?

  5. A family has two children. You learn that at least one of them is a boy who was born on a Tuesday. Assuming each child
  is equally likely to be a boy or a girl and to be born on any day of the week, independently, what is the probability that
  both children are boys?


  End with a section headed ANSWERS, one line per question in the form `1. <answer>`.

  '
