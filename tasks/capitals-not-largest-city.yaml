id: capitals-not-largest-city
name: Capitals, not the largest city
aliases:
- GEOG-1
needs_tools: false
category: geography
area: geography
tier: spark
version: 1
rubric_version: 2
status: active
auto_grade: false
repo: null
prompt: 'What is the capital of each of these countries? Answer with one line per country, in the form `Country: Capital`.


  Australia, Canada, Brazil, Nigeria, Türkiye, Switzerland

  '
# Header-less: the six `Country: Capital` lines the prompt asks for are the block (the last line for a
# country wins). A capital named in prose, or a big city in its place, scores nothing; that makes the old
# big-city trap check redundant, so it is gone.
checks:
- id: capitals
  type: items
  header: null
  normalize: name
  items:
  - {id: australia, key: Australia, expect: Canberra, label: 'Australia is Canberra'}
  - {id: canada, key: Canada, expect: Ottawa, label: 'Canada is Ottawa'}
  - {id: brazil, key: Brazil, expect: Brasília, aliases: [Brasilia], label: 'Brazil is Brasília'}
  - {id: nigeria, key: Nigeria, expect: Abuja, label: 'Nigeria is Abuja'}
  - {id: turkiye, key: [Türkiye, Turkey], expect: Ankara, label: 'Türkiye is Ankara'}
  - {id: switzerland, key: Switzerland, expect: Bern, aliases: [Berne], label: 'Switzerland is Bern'}
  rule: 'Each country line names its capital and nothing else: Australia: Canberra, Canada: Ottawa, Brazil: Brasília,
    Nigeria: Abuja, Türkiye: Ankara, Switzerland: Bern; one item per country.'
rubric:
- criterion: Capitals
  max_score: 6
  check: capitals
  description: 'Each of the six `Country: Capital` lines names the right capital (one point each); the largest city instead
    (Sydney, Toronto, Rio/São Paulo, Lagos, Istanbul, Zürich/Geneva) scores nothing.'
critical_failure: null
