id: names-for-one-character
name: Names for one character
aliases:
- WRIT-2b
needs_tools: false
category: writing
area: writing
tier: temper
version: 2
rubric_version: 4
status: active
auto_grade: false
repo: null
prompt: |
  Generate 20 names for a 34-year-old woman who grew up in a working-class family in the upper Midwest, is highly intelligent, dryly funny, ambitious, and emotionally guarded. Her family background is Polish-American. The novel is contemporary literary fiction. Avoid names that feel stereotypical or caricatured for the character's heritage. Say briefly why each name fits, and pick the strongest five.

  Explain your reasoning first if it helps. Then end your reply with these two blocks, in this order, and nothing after them:

  NAMES:
  <number>. <First Last> — <reason>

  TOP FIVE:
  <number>. <First Last>

  NAMES has 20 numbered lines, each a different name and a short reason. TOP FIVE has the five strongest, each one taken from the NAMES list.
checks:
- id: names_list
  type: items
  header: [NAMES, NAME]
  multiline: true
  items:
  - {id: twenty, normalize: count, expect: 20, label: "Twenty lines"}
  - {id: distinct, normalize: distinct, label: "All names distinct"}
  - id: reasons
    normalize: each
    expect: '\S\s*(?:\s[—–-]+\s|[—–:])\s*\S+(?:\s+\S+){2,}'
    label: "Every line has a reason"
  - {id: blocklist, normalize: pattern, part: name, absent: true, expect: '\b(?:harry potter|hermione|katniss|sherlock|gatsby|atticus finch|holden caulfield|elizabeth bennet|frodo|bilbo|gandalf|daenerys|jon snow|bella swan|edward cullen|lisbeth salander|jay gatsby|scout finch|walter white|don draper|carrie bradshaw|taylor swift|beyonc|oprah|kardashian|elon musk|barack obama|tony stark|bruce wayne|peter parker|clark kent|babushka|pierogi|kielbasa)', label: "No blocklisted name"}
  rule: "The NAMES: block has 20 numbered lines, no name twice, a reason (at least three words after a dash) on every line, and no famous or caricature name (blocklist) among the names."
- id: top_five
  type: items
  header: [TOP FIVE, TOP 5]
  multiline: true
  items:
  - {id: five, normalize: count, expect: 5, label: "Five top names"}
  - {id: from_list, normalize: subset, source: [NAMES, NAME], label: "Every top name is on the list"}
  rule: "The TOP FIVE: block has exactly five names, each one in the NAMES: list."
rubric:
- {criterion: The list, max_score: 4, check: names_list, description: "Twenty lines, all distinct, each with a reason, none on the blocklist."}
- {criterion: The top five, max_score: 2, check: top_five, description: "Five names, all from the list."}
critical_failure: null
# Kept as a saturated task in Suite v2 (decision D11): no extra constraints. 6 equal items.
