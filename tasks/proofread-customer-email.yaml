id: proofread-customer-email
name: Proofread a customer email
aliases:
- WRIT-1a
needs_tools: false
category: writing
area: writing
tier: spark
version: 2
rubric_version: 4
status: active
auto_grade: false
repo: null
prompt: |
  Proofread the email below for grammar, spelling and punctuation errors. Distinguish clearly between objective errors and optional style improvements. Do not change the facts or make the customer sound more apologetic than the original.

  Subject: Refund for order 84721

  Hi Support,
  I am writing because my order arrived three days late, and one of the two items were damaged. I contacted support last week but I havent heard anything back. The box was clearly crush on one side, and the mug inside has a crack through the handle. I would like a refund for the mug, but please let me know if you need pictures of it. Also, your website says refunds are processed in 5-7 business days, which seem to have passed already for my earlier request. Can you tell me what the status is? Thanks for your help.

  Explain your reasoning first if it helps. Then end your reply with these three blocks, in this order, and nothing after them:

  ERRORS:
  <original> → <fix>

  CORRECTED:
  <the full corrected email>

  STYLE:
  <optional suggestion>

  ERRORS has one line per objective error, giving the original words and the fixed words only; optional style changes do not belong there. CORRECTED holds the whole email with the errors fixed and the facts unchanged. STYLE has one line per optional suggestion, or `STYLE: none`.
checks:
- id: errors_listed
  type: items
  header: [ERRORS, ERROR]
  multiline: true
  items:
  - id: havent
    normalize: pattern
    expect: '\bhavent\b.*(?:→|⇒|->|=>|\\rightarrow).*\bhaven[''’]t\b'
    label: "havent listed with its fix"
  - id: crush
    normalize: pattern
    expect: '\bcrush\b.*(?:→|⇒|->|=>|\\rightarrow).*\bcrushed\b'
    label: "crush listed with its fix"
  - id: agreement
    normalize: pattern
    expect: '\b(?:items )?were damaged\b.*(?:→|⇒|->|=>|\\rightarrow).*\bwas damaged\b'
    label: "items were damaged listed with its fix"
  rule: "Lists each of the three errors in the ERRORS: block as <original> → <fix>: havent → haven't, crush → crushed, and 'items were damaged' → 'was damaged'; one item per error."
- id: errors_fixed
  type: items
  header: [CORRECTED, CORRECT]
  multiline: true
  items:
  - id: havent
    normalize: pattern
    expect: '\bhaven[''’]t\b'
    label: "havent fixed in the email"
  - id: crush
    normalize: pattern
    expect: '\bcrushed\b'
    label: "crush fixed in the email"
  - id: agreement
    normalize: pattern
    expect: '\bone of the two items was damaged\b'
    label: "items were damaged fixed in the email"
  rule: "Fixes each error in the CORRECTED: email: haven't, crushed, and 'one of the two items was damaged'; one item per error."
- id: facts_kept
  type: items
  header: [CORRECTED, CORRECT]
  multiline: true
  items:
  - {id: order, normalize: pattern, expect: '84721', label: "Order 84721 kept"}
  - {id: late, normalize: pattern, expect: '\bthree days\b', label: "Three days late kept"}
  - {id: refunds, normalize: pattern, expect: '\b5\s*[-–‑‒]\s*7 business days\b', label: "5-7 business days kept"}
  - {id: mug, normalize: pattern, expect: '\bmug\b', label: "The mug kept"}
  - {id: handle, normalize: pattern, expect: '\bhandle\b', label: "The handle kept"}
  rule: "Keeps the five facts in the CORRECTED: email: order 84721, three days late, 5-7 business days, the mug and its handle; one item per fact."
- id: tone_kept
  type: items
  header: [CORRECTED, CORRECT]
  multiline: true
  items:
  - {id: no_apology, normalize: pattern, expect: '\b(?:sorry|apologi\w*|apology|apologies|regret\w*)', absent: true, label: "No apology added"}
  rule: "Adds no apology to the CORRECTED: email (no 'sorry', 'apologize' or 'regret')."
- id: errors_only
  type: items
  header: [ERRORS, ERROR]
  multiline: true
  items:
  - id: no_style_items
    normalize: each
    expect: '\bhavent\b|\bhaven[''’]t\b|\bcrush|\bwere damaged\b|\bwas damaged\b'
    label: "Only the three errors in ERRORS"
  rule: "Lists only the three real errors (havent, crush and 'items were damaged') in the ERRORS: block; a style suggestion (a comma before 'but', 'seem' or 'seems', the greeting, the en dash) listed there fails."
rubric:
- {criterion: Errors found, max_score: 3, check: errors_listed, description: "havent, crush and 'items were damaged' each listed as <original> → <fix> in the ERRORS block."}
- {criterion: Errors fixed, max_score: 3, check: errors_fixed, description: "Each of the three errors fixed in the CORRECTED email (the agreement error is the hardest)."}
- {criterion: Keeps the facts, max_score: 5, check: facts_kept, description: "Order number, three days, 5-7 business days, the mug and the handle unchanged in the CORRECTED email."}
- {criterion: Keeps the customer's tone, max_score: 1, check: tone_kept, description: "No apology added in the CORRECTED email."}
- {criterion: Errors kept apart from style, max_score: 1, check: errors_only, description: "No optional style change listed as an error."}
critical_failure: null
# Only the last ERRORS:, CORRECTED: and STYLE: blocks are read, and each check reads one block, so a fix
# quoted in an explanation earns nothing and an apology quoted there costs nothing. 13 equal items.
