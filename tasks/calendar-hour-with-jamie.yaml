id: calendar-hour-with-jamie
name: An hour with Jamie
aliases:
- TASK-5
needs_tools: true
mcp_servers:
  - mock-calendar:pair
category: long_agent
area: everyday
tier: temper
version: 2
rubric_version: 2
status: provisional
auto_grade: true
repo: null
prompt: |
  I need to meet up with Jamie for an hour sometime this week for work. Find a time that works for both of us.

  Explain your reasoning first if it helps. Then end your reply with this block, and nothing after it:

  OPTIONS:
  YYYY-MM-DD HH:MM <time zone>

  One line per option, in 24-hour time, with a time zone abbreviation or name (for example CDT or America/Chicago). Give two or three options, best first.
checks:
- id: options_valid
  type: time_options
  header: OPTIONS
  dataset: pair
  attendees: [alex@example.com, jamie@example.com]
  until: '2026-09-05T00:00:00'
  minutes: 60
  items:
  - {id: valid, kind: in_set, label: 'Every option is a time both are free, in business hours'}
  - {id: count, kind: count, min: 2, max: 3, label: 'Two or three options'}
  rule: 'Every OPTIONS line is a 60-minute start that is free for both people inside weekday 9-5 (computed from the dataset), with no repeats, and there are two or three lines.'
- id: options_handling
  type: time_options
  header: OPTIONS
  dataset: pair
  attendees: [alex@example.com, jamie@example.com]
  until: '2026-09-05T00:00:00'
  minutes: 60
  items:
  - id: status
    kind: includes_any
    match: [{weekday: fri}, {date: '2026-09-03', time: '13:00'}]
    label: 'Offers a time that depends on a declined or transparent event'
  - {id: not_past, kind: not_before_now, label: 'No option before now'}
  rule: 'At least one valid option is Thursday 13:00 or on Friday (it needs Alex''s declined and transparent events read as not blocking), and no option is before Monday 8:30 AM.'
rubric:
- {criterion: Valid, concrete options, max_score: 2, check: options_valid, description: 'Each option is a ground-truth start, and two or three are given.'}
- {criterion: Reads event status and time, max_score: 2, check: options_handling, description: 'Uses a time that needs declined/transparent events read correctly, and nothing in the past.'}
