[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "3.5.1"
description = "Personal AI benchmark gauntlet for evaluating models on real-world tasks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
]

[project.scripts]
crucible = "crucible.cli:main"

[project.urls]
Homepage = "https://github.com/schaferandrew/crucible"

[tool.setuptools.packages.find]
where = ["."]
include = ["crucible*"]

[tool.setuptools.package-data]
"crucible.agents" = ["*.ts"]
"crucible" = ["schemas/*.json"]

# Only Crucible's own tests: graders/ holds solutions and calibration fixtures with test files that
# only run inside a grader's isolated copy
[tool.pytest.ini_options]
testpaths = ["tests"]
