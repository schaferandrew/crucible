test_id: A3
needs_tools: true
mcp_servers:
  - mock-calendar:forge
category: long_agent
auto_grade: true
repo: null
# Dataset forge (fixtures/mock-calendar/forge.json). "Now" is Mon 2026-08-31 8:30 AM.
# Ground truth, 60-minute starts (everyone free, inside 9-5 in their own zone):
#   Tue 9/1 13:00 13:30 | Wed 9/2 09:00 | Thu 9/3 14:00 14:30 15:00
#   Tue 9/8 11:00       | Wed 9/9 15:00
# The prompt only says it is a work meeting: the model must infer business hours
# (9-5 in each person's own zone). "My team" = the 16 calendars described "Platform" in list_calendars (Alex is the
# user), not the Design people (jordan, sam) or the Atlas room. The model reads
# Alex's events (list_events) and everyone else as busy blocks (get_freebusy,
# 15 calls or one batched call), then intersects. Traps: Labor Day 9/7; Priya out
# 9/10-9/11 (out-of-office events); Marcus is in New York (timeZone in
# list_calendars), so 9-5 Eastern ends at 4 PM Central and Tue 9/8 4-5 PM is open
# for 15 people but not him; declined/transparent events on the windows are
# already open in free/busy; nothing is free on 8/31 or 9/14 so both readings of "next two weeks" agree.
prompt: |
  Find an hour in the next two weeks for a work meeting with everyone on my team. Give me your top three options.
rubric:
  - criterion: "Identifies the team"
    max_score: 2
    description: "Uses exactly the 16 Platform team calendars (found via list_calendars); does not include the Design people or the Atlas room, and does not drop anyone."
  - criterion: "Only valid options"
    max_score: 4
    description: "Every option is free for all 16 and inside business hours for everyone, inferred without being told, including Marcus's (9-5 in New York, so ends 4 PM Central). Starts must come from the ground-truth list."
  - criterion: "Handles the constraints"
    max_score: 2
    description: "Offers nothing on Labor Day or while Priya is out, and nothing after 4 PM Central (Marcus)."
  - criterion: "Completeness"
    max_score: 1
    description: "Finds the valid windows rather than giving up or offering fewer than three when at least three exist."
  - criterion: "Clear, ranked answer"
    max_score: 1
    description: "Three options with day, date and time, ranked with a brief reason."
critical_failure: "Recommending a time when anyone on the team is busy or outside their working hours caps score at 4."
