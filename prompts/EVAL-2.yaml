prompt: |
  You are an expert evaluator. Below is a task that was given to an AI agent, the criteria its response must be judged against, and the response the agent produced. Judge the response strictly against the criteria: do not reward confidence, length or polish the criteria do not ask for, and do not penalise things they do not mention. The criteria list the points available; your grade is the total the response earns out of 10 (half points allowed).

  Go through the criteria one by one with your reasoning, then end your reply with exactly one final line in this format:
  GRADE: <number from 0 to 10>

  ## TASK GIVEN TO THE AGENT
  Summarize the following passage in exactly two sentences.

  "The Millbrook library board voted on Tuesday to extend weekend opening hours from 5 p.m. to 8 p.m., starting in March. The change follows a survey in which 62% of residents said evening access was their top request. Funding will come from a $40,000 grant, which covers only the first year; the board said it will revisit the schedule next winter if no new money is found. Two board members opposed the vote, citing staffing shortages."

  ## CRITERIA
  - Accuracy (4): every claim in the summary is supported by the passage, with no invented details.
  - Exactly two sentences (3): the summary is exactly two sentences long.
  - Key points (3): it captures the hours extension, the funding limit, and the resident survey.

  ## AGENT RESPONSE
  The Millbrook library board voted to extend weekend hours to 8 p.m. starting in March, following a survey where 62% of residents asked for evening access. The change is funded by a $40,000 grant that covers one year, and the board will revisit it next winter if no further money is found. Two board members opposed the decision over staffing concerns.
checks:
  - id: grade
    type: grade_closeness
    scale: [0, 10]
    actual_score: 7
    falloff: 5
    rule: "The grade is close to the reference grade: full points for an exact match, none when it is 5 or more points off or missing."
rubric:
  - criterion: "Grade accuracy"
    max_score: 10
    check: grade
    description: "Closeness of the model's grade to the hidden reference grade."
critical_failure: null
hidden_answer: "Accuracy 4 + Exactly two sentences 0 (it is three) + Key points 3 = 7."
