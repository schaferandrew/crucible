prompt: 'Fact-check this paragraph before it goes in a newsletter. Some of it is wrong and some of it is right.


  "Christopher Columbus first reached the Americas in 1493. In 1215 King Richard sealed Magna Carta at Runnymede. The United
  States Declaration of Independence was adopted on July 4, 1776. Napoleon was finally defeated at the Battle of Waterloo
  in 1812. The Titanic sank in April 1912 on its return voyage from New York. Neil Armstrong and Buzz Aldrin landed on the
  Moon in July 1969. The Berlin Wall fell in November 1991, and Germany reunified the following year."


  List each error on its own line as `wrong → correct`. Don''t flag anything that is accurate.

  '
checks:
- id: columbus
  type: required_patterns
  patterns:
  - \b1492\b
  rule: Corrects Columbus to 1492.
- id: king_john
  type: required_patterns
  patterns:
  - \bjohn\b
  rule: Corrects the king to John.
- id: waterloo
  type: required_patterns
  patterns:
  - \b1815\b
  rule: Corrects Waterloo to 1815.
- id: maiden_voyage
  type: required_patterns
  patterns:
  - \bmaiden\b
  rule: Corrects the Titanic to its maiden voyage (to New York).
- id: berlin_wall
  type: required_patterns
  patterns:
  - \b1989\b
  rule: Corrects the Berlin Wall to 1989.
- id: no_false_flags
  type: forbidden_patterns
  patterns:
  - (?im)^[^\n]*(1776|declaration|1969|armstrong|aldrin|runnymede)[^\n]*(→|->)
  rule: Doesn't mark the Declaration (1776), the Moon landing (1969) or Runnymede as errors.
