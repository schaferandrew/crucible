prompt: 'Which of these countries are landlocked (no coastline on the open ocean or a sea connected to it)?


  Croatia, Bolivia, Kazakhstan, Eritrea, Austria, Laos, Mozambique, Paraguay, Serbia, Vietnam, Ethiopia, Uzbekistan, Zambia,
  Hungary, Mongolia


  Then say which one of them is doubly landlocked (surrounded only by landlocked countries).


  Answer in exactly three lines:

  Landlocked: <countries, comma-separated>

  Not landlocked: <countries, comma-separated>

  Doubly landlocked: <country>

  '
checks:
- id: landlocked_found
  type: required_patterns
  patterns:
  - (?im)^\W*landlocked:.*\bbolivia\b
  - (?im)^\W*landlocked:.*\bkazakhstan\b
  - (?im)^\W*landlocked:.*\baustria\b
  - (?im)^\W*landlocked:.*\blaos\b
  - (?im)^\W*landlocked:.*\bparaguay\b
  - (?im)^\W*landlocked:.*\bserbia\b
  - (?im)^\W*landlocked:.*\bethiopia\b
  - (?im)^\W*landlocked:.*\buzbekistan\b
  - (?im)^\W*landlocked:.*\bzambia\b
  - (?im)^\W*landlocked:.*\bhungary\b
  - (?im)^\W*landlocked:.*\bmongolia\b
  rule: 'The Landlocked line lists all 11: Bolivia, Kazakhstan, Austria, Laos, Paraguay, Serbia, Ethiopia, Uzbekistan, Zambia,
    Hungary, Mongolia.'
- id: coastal_not_listed
  type: forbidden_patterns
  patterns:
  - (?im)^\W*landlocked:.*\b(croatia|eritrea|mozambique|vietnam)\b
  rule: The Landlocked line includes none of Croatia, Eritrea, Mozambique, Vietnam.
- id: doubly
  type: required_patterns
  patterns:
  - (?im)^\W*doubly landlocked:\W*uzbekistan\b
  rule: The doubly landlocked country is Uzbekistan.
rubric:
- criterion: All landlocked found
  max_score: 4
  check: landlocked_found
