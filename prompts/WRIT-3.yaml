test_id: WRIT-3
needs_tools: false
category: writing
area: writing
tier: spark
version: 1
rubric_version: 2
status: provisional
auto_grade: true
repo: null
prompt: |
  Give me a haiku about rivers.
  Don't mention water, waves, ripples, wet, or bank.
checks:
  - id: no_forbidden_words
    type: forbidden_patterns
    patterns:
      - '\w*water\w*'
      - '\w*waves?\b|\bwav(y|ier|iest|ed|ing)\b'
      - '\w*rippl\w*'
      - '\bwet\w*'
      - '\w*banks?\b'
    rule: "Never uses water, waves, ripples, wet or bank in any form (riverbank, waterfall, wavy, wetland...)."
  - id: three_lines
    type: line_count
    lines: 3
    rule: "Answers with exactly three lines (a haiku, nothing around it)."
  - id: about_a_river
    type: required_patterns
    min_matches: 1
    patterns: ['\b(river|stream|creek|current|flow\w*|bend|stone\w*|pebble\w*|delta|valley|downstream|upstream|reed\w*|heron|mouth|source|silt|eddy|ford|course|cours\w*|run\w*)\b']
    rule: "Uses at least one river image (current, stone, bend, heron, flow, valley...)."
rubric:
  - criterion: "No forbidden words"
    max_score: 4
    check: no_forbidden_words
    description: "None of the forbidden words in any form."
  - criterion: "Is a haiku"
    max_score: 3
    check: three_lines
    description: "Exactly three lines, nothing else."
  - criterion: "Evokes a river"
    max_score: 3
    check: about_a_river
    description: "At least one river image."
critical_failure: null
