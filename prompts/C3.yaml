    max_score: 3
    description: "Fix respects Next.js App Router server/client boundaries."
  - criterion: "Functional result"
    max_score: 2
    description: "acct_1 name and plan render correctly."
  - criterion: "Regression test"
    max_score: 1
    description: "A test covers the original bug."
  - criterion: "Scope/quality"
    max_score: 1
    description: "Minimal, clean diff with good code quality."
critical_failure: "Making server-only data broadly client-accessible merely to bypass the error caps the score at 5."
