test_id: C1b
needs_tools: true
category: coding_build
auto_grade: true
repo: null
auto_grader:
  type: module
  module: crucible.graders.c1_compound
prompt: |
  Build a CLI compound-interest calculator. It must accept principal, annual interest rate, time, compounding frequency, and optional recurring contribution amount and contribution frequency. Support at least years and months for time. Print a readable summary containing principal, total contributions, interest earned, and final balance. Validate invalid, negative, or contradictory inputs. Include automated tests covering ordinary cases, zero interest, monthly compounding, recurring contributions, invalid input, and a known expected-value case. Keep the implementation dependency-light and document the command examples in the README.
rubric:
  - criterion: "Requirements captured without being reminded"
    max_score: 2
    description: "Did it build something useful without the explicit Part 2 spec?"
  - criterion: "Correct financial math"
    max_score: 3
    description: "Compound interest formula is correct; recurring contributions are handled properly."
  - criterion: "Input validation"
    max_score: 2
    description: "Invalid, negative, and contradictory inputs are rejected gracefully."
  - criterion: "Tests"
    max_score: 2
    description: "Automated tests cover ordinary, edge, and known-value cases and all pass."
  - criterion: "UX / docs"
    max_score: 1
    description: "README with command examples and readable output."
critical_failure: "Wrong compound-interest math = maximum score 4/10."
