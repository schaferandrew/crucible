test_id: A2
needs_tools: true
mcp_servers:
  - mock-calendar:pair
category: long_agent
auto_grade: true
repo: null
# Dataset pair (fixtures/mock-calendar/pair.json). "Now" is Mon 2026-08-31 8:30 AM.
# Ground truth: 60-minute starts (30-minute grid, 9-5 weekdays, both free):
#   Wed 15:30 16:00 | Thu 11:00 13:00 16:00 | Fri 10:30 11:00 15:00 15:30 16:00
# The prompt only says it is for work: the model must infer business hours. Nothing
# works Monday or Tuesday. The model reads Alex's events (list_events) and
# sees Jamie only as busy blocks (get_freebusy; her events are not readable, 403).
# Thu 13:00 depends on Alex's declined 1:00-3:00 Design sync, Fri on a transparent
# all-day birthday; Jamie's declined Thu 1:1 is already open in her free/busy.
prompt: |
  I need to meet up with Jamie for an hour sometime this week for work. Find a time that works for both of us.
rubric:
  - criterion: "Only valid times"
    max_score: 4
    description: "Every proposed time is free on both calendars, inside business hours (9-5, weekdays) without being told, and after now. Starts must come from the ground-truth list."
  - criterion: "Reads event status correctly"
    max_score: 2
    description: "Treats Alex's declined and transparent (shown as free) events as not blocking, e.g. offers Thu 1:00 PM or Friday."
  - criterion: "Concrete options"
    max_score: 2
    description: "Offers two or three specific date/time options rather than a single guess or general advice."
  - criterion: "Completeness"
    max_score: 1
    description: "Does not claim nothing works, and does not rule out valid days (Wed, Thu, Fri)."
  - criterion: "Clear answer"
    max_score: 1
    description: "Day, date and time are unambiguous, with the time zone or assumptions stated."
critical_failure: "Recommending a time that conflicts with a real event on either calendar caps score at 4."
