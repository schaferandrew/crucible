    max_score: 3
    description: "One-sentence definition is correct and precise."
  - criterion: "Mechanism"
    max_score: 2
    description: "Explains the two-sided market deterioration clearly."
  - criterion: "Examples"
    max_score: 2
    description: "Two concrete, non-repetitive examples."
  - criterion: "Boundaries/limitations"
    max_score: 2
    description: "Clearly states what the concept does and does not claim; discusses criticisms."
  - criterion: "Clarity"
    max_score: 1
    description: "Plain English; jargon is defined if used."
