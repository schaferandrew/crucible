test_id: KNOW-1
category: everyday
area: general
tier: spark
version: 1
rubric_version: 2
status: active
needs_tools: false
auto_grade: true
repo: null
prompt: |
  What color are firetrucks in the US? Answer in one or two sentences.
checks:
  - id: says_red
    type: required_patterns
    patterns: ['\bred\b']
    rule: "Says US fire trucks are red (lime-yellow or white variants can be mentioned too)."
  - id: red_first
    type: required_patterns
    patterns: ['(?is)\A(?:(?!\b(?:lime|yellow|white|blue|green|orange|black|silver)\b).)*?\bred\b']
    rule: "Red is the first color it names (other colors mentioned afterward as variants are fine)."
  - id: brief
    type: non_empty
    min_words: 3
    max_words: 60
    rule: "Answers in a sentence or two (at most 60 words)."
rubric:
  - criterion: "Correct answer"
    max_score: 7
    check: says_red
    description: "States that fire trucks in the US are (predominantly) red."
  - criterion: "Red is the answer"
    max_score: 2
    check: red_first
    description: "Red comes first, not another color with red as an aside."
  - criterion: "Brief"
    max_score: 1
    check: brief
    description: "One or two sentences, as asked."
critical_failure: null
