# Hidden tests for accessibility-audit-fixes (formerly CODE-15); see crucible/graders.py.
# Isolated: the tests run in a fresh copy of repos/conduit-a11y that takes only the web app's source
# from the model's workspace, so package.json, the vitest setup, axe-core's version and the seeded
# tests stay as seeded.
isolated: true
artifacts: [apps/web/src]
# The seeded repo has no lockfile, so the grader pins its own
lockfile: package-lock.json
# The hidden tests are web tests: they run from apps/web, like the repo's own
test_roots:
  "*.web.grader.test.tsx": apps/web
# Caps, not points (see the task's rubric): they pass on the seeded repo
existing_tests: [apps/web, apps/api]
unchanged: [apps/api/test/realworld.contract.test.ts]
# The model's own new tests: pass on its fix, fail on the seeded code. One test in the pool, like the rest
regression_tests: [apps/web]
timeout: 600
# `crucible grader accessibility-audit-fixes` grades each of these and checks the score lands in its range
oracle:
  solution: [10, 10]
  seeded: [0, 0]
  calibration:
    aria-only: [3.4, 5.4]           # roles and aria attributes on the same divs: no keyboard handling, no focus management
    dialog-only: [1.3, 3.3]         # the dialog fixed, everything else untouched
    breaks-existing-tests: [5, 5]  # everything, but the favorite button is no longer disabled when signed out: the seeded test fails, capped at 5
