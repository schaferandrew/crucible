# Hidden tests for migrate-pages-to-app-router; see crucible/graders.py.
# Isolated: the tests run in a fresh copy of repos/lantern-books-pages that takes only `artifacts`
# from the model's workspace, so package.json, the lockfile, next.config.js, tsconfig.json and the
# vitest config stay as seeded and node_modules is installed from the seeded lockfile. `pages` is an
# artifact: a model that deletes pages/ leaves nothing to take, and the seeded folder is dropped.
isolated: true
artifacts: [app, pages, components, lib, styles]
existing_tests: [.]
timeout: 900
# The oracle can only overlay files, not delete them, so each overlay that has removed pages/ carries
# pages/.crucible-removed, which the hidden tests treat as "the folder is gone".
# `crucible grader migrate-pages-to-app-router` grades each of these and checks the score lands in its range
oracle:
  solution: [10, 10]
  seeded: [0, 0]
  calibration:
    loses-search-url: [5.5, 6.5]    # everything migrated except /search: capped at 6 (a URL is lost)
    app-shells-only: [0, 1]         # pages/ kept, app/ shells added: the build fails on the conflicting routes
    books-prerendered: [7.5, 8.5]   # all migrated, but the book page is prerendered and its view counter freezes: capped at 8
