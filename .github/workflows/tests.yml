name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install crucible
        run: python -m pip install -e . pytest
      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
      - name: Run tests (includes pi end-to-end against a scripted model)
        run: python -m pytest -v

  # Two release tracks (docs/versioning.md#releases): tool changes need a version bump and a CHANGELOG.md
  # entry; task changes need a SUITE_CHANGELOG.md entry, a clean lock and a suite that still holds;
  # suite files are never edited. The logic is crucible/ci.py, tested in tests/test_ci.py.
  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crucible
        run: python -m pip install -e .
      - name: Release check
        run: python -m crucible.ci --base "${{ github.event.pull_request.base.sha }}"
