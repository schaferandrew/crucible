name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install crucible
        run: python -m pip install -e . pytest
      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
      - name: Run tests (includes pi end-to-end against a scripted model)
        run: python -m pytest -v

  # Every change that lands on main is a release (see AGENTS.md): a PR that touches the code or
  # the tests must bump the version and add that version's changelog entry.
  release-notes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version bump and changelog entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD -- crucible prompts graders fixtures repos pyproject.toml)
          if [ -z "$changed" ]; then echo "No code or test changes: no release needed."; exit 0; fi
          version() { sed -n 's/^version = "\(.*\)"/\1/p'; }
          old=$(git show "$BASE":pyproject.toml | version)
          new=$(version < pyproject.toml)
          echo "version: $old -> $new"
          if [ "$old" = "$new" ]; then
            echo "::error file=pyproject.toml::This PR changes code or tests but keeps version $old. Bump it (see AGENTS.md)."
            exit 1
          fi
          if ! grep -q "^## $new " CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Add a '## $new (YYYY-MM-DD)' section describing this release (see AGENTS.md)."
            exit 1
          fi
          echo "Release $new is described in CHANGELOG.md."
